[package]
name = "sway"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sway-msg"
path = "src/bin.rs"

[dependencies]
serde = { workspace = true, default-features = false, features = ["derive"] }
thiserror = { workspace = true, default-features = false }
strum = { version = "0.28.*", default-features = false, features = ["derive"] }
serde_json = { version = "1.*", default-features = false, features = ["std"] }
tokio = { workspace = true, default-features = false, features = [
  "rt",
  "io-util",
  "net",
  "macros",
  "time",
] }
tokio-util = { workspace = true, default-features = false }
nutype = { workspace = true, default-features = false, features = ["std"] }
tracing = { workspace = true, default-features = false }
derive_more = { workspace = true, default-features = false, features = [
  "display",
] }
debounce = { path = "../debounce/" }

[features]
testing = []

[lints]
workspace = true
