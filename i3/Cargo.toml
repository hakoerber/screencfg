[package]
name = "i3"
version.workspace = true
edition.workspace = true

[[bin]]
name = "i3-msg"
path = "src/bin.rs"

[dependencies]
serde = { workspace = true , default-features = false, features = ["derive"] }
thiserror = { workspace = true, default-features = false }
strum = { version = "0.28.*", default-features = false, features = ["derive"] }
serde_json = { version = "1.*", default-features = false, features = ["std"] }
tokio = { workspace = true, default-features = false, features = ["rt", "io-util", "net", "macros", "time"] }
tokio-util = { workspace = true, default-features = false }
debounce = { path = "../debounce/"}

[features]
testing = []

[lints]
workspace = true
